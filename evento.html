    <link rel="preconnect" href="https://fonts.googleapis.com">

        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <script src="./assets/js/theme.js"></script>
</head>

<body class="site">
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <nav class="header-menu" aria-label="Principal">
        <a href="index.html" class="brand">
            <img class="logo" alt="Eventos Fatec — início" src="./assets/images/logotipo-eventos-fatec.png" />
        </a>
        <ul class="navigation">
            <li class="item">
                <a class="link" href="index.html">Início</a>
            </li>
            <li class="item">
                <a class="link" href="index.html#eventos">Eventos</a>

            <li class="item">

            </li>
        </ul>

            <span aria-hidden="true">/</span>
            <span id="breadcrumb-titulo" aria-current="page">Carregando...</span>
        </nav>

        <div id="detalhe-skeleton" class="detail-skeleton" aria-hidden="true">
            <div class="detail-skeleton-cover"></div>
            <span class="sk-line"></span>
            <span class="sk-line sk-line--short"></span>
        </div>

        <div id="detalhe-conteudo" hidden></div>

        <div id="detalhe-nao-encontrado" class="empty-state" hidden>

            <a class="btn-cta" href="index.html#eventos">Ver todos os eventos</a>

    <footer class="footer">
        <p>© 2026 Eventos Fatec — Projeto de Desenvolvimento Web, 2º ciclo.</p>
