<!DOCTYPE html>
<html lang="pt-BR" data-auth="required">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Inscritos | Painel Administrativo</title>
    <link rel="stylesheet" href="../assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Autenticação: carregada no <head> para validar a sessão antes de exibir a página -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <script src="../supabase-credentials.js"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="./js/services/authService.js"></script>
    <script src="./js/guard.js"></script>

    <!-- Tema: no <head> para aplicar antes da primeira pintura (sem "flash") -->
    <script src="../assets/js/theme.js"></script>
</head>

<body>
    <nav class="header-menu">
        <img class="logo" alt="logotipo eventos fatec" title="Logotipo eventos fatec"
            src="../assets/images/logotipo-eventos-fatec.png" />
        <ul class="navigation">
            <li class="item">
                <a class="link" href="index.html">Painel</a>
            </li>
            <li class="item">
                <a class="link" href="eventos.html">Eventos</a>
            </li>
            <li class="item">
                <a class="link" href="categorias.html">Categorias</a>
            </li>
            <li class="item">
                <a class="link active" href="inscritos.html">Inscritos</a>
            </li>
            <li class="item">
                <a class="link" href="usuarios.html">Usuários</a>
            </li>
            <li class="item">
                <a class="link" id="logout" href="login.html">Sair</a>
            </li>
        </ul>
    </nav>

    <main class="admin">
        <div class="admin-header">
            <div>
                <h1>Inscritos</h1>
                <p>Veja quem se inscreveu em cada evento.</p>
            </div>
        </div>

        <p class="feedback" id="inscritos-feedback" role="status" aria-live="polite"></p>

        <section class="admin-panel">
            <h2>Inscrições cadastradas</h2>

            <div class="admin-filter">
                <label for="filtro-evento">Evento</label>
                <select id="filtro-evento">
                    <option value="">Todos os eventos</option>
                </select>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>WhatsApp</th>
                            <th>Evento</th>
                            <th>Inscrito em</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="inscritos"></tbody>
                </table>
            </div>

            <div id="inscritos-paginacao"></div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 Eventos Fatec — Projeto de Desenvolvimento Web, 2º ciclo.</p>
    </footer>

    <script src="../assets/js/utils/dom.js"></script>
    <script src="../assets/js/utils/text.js"></script>
    <script src="../assets/js/utils/pagination.js"></script>
    <script src="./js/services/eventosService.js"></script>
    <script src="./js/services/inscricoesService.js"></script>
    <script src="./js/pages/inscritos.js"></script>
</body>

</html>
