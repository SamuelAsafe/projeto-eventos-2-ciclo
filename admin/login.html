<!DOCTYPE html>
<html lang="pt-BR" data-auth="guest">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark light">
    <title>Entrar | Painel Administrativo</title>
    <link rel="stylesheet" href="../assets/css/styles.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">

    <!-- Tema: no <head> para aplicar antes da primeira pintura (sem "flash") -->
    <script src="../assets/js/theme.js"></script>
</head>

<body>
    <nav class="header-menu">
        <img class="logo" alt="logotipo eventos fatec" title="Logotipo eventos fatec"
            src="../assets/images/logotipo-eventos-fatec.png" />
        <ul class="navigation">
            <li class="item">
                <a class="link" href="../index.html">Voltar para o site</a>
            </li>
        </ul>
    </nav>

    <main class="login">
        <h1>Entrar no painel</h1>
        <p>Acesso restrito à equipe organizadora dos eventos.</p>

        <div class="admin-panel">
            <p class="feedback" id="login-feedback" role="alert" aria-live="assertive"></p>

            <form class="admin-form" id="form-login" novalidate>
                <div class="form-field">
                    <label for="campo-email">E-mail</label>
                    <input type="email" id="campo-email" name="email" placeholder="voce@fatec.sp.gov.br"
                        autocomplete="username" required />
                    <span class="error">Informe o e-mail.</span>
                </div>

                <div class="form-field">
                    <label for="campo-senha">Senha</label>
                    <input type="password" id="campo-senha" name="senha" placeholder="Sua senha"
                        autocomplete="current-password" required />
                    <span class="error">Informe a senha.</span>
                </div>

                <button type="submit" class="call-to-action">Entrar</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>© 2026 Eventos Fatec — Projeto de Desenvolvimento Web, 2º ciclo.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
    <script src="../supabase-credentials.js"></script>
    <script src="../assets/js/supabaseClient.js"></script>
    <script src="./js/services/authService.js"></script>
    <script src="../assets/js/utils/dom.js"></script>
    <script src="./js/pages/login.js"></script>
</body>

</html>
